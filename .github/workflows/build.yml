# Builds emot3 and publishes release assets whenever a tag matching v* is pushed.
#
# Build matrix is asymmetric by event type to cut PR-CI time roughly in half:
#   pull_request -> DevTools + PlusDevTools only (the +devtools artifact is the
#                   only one we ever grab to test a PR in-game; the public-shape
#                   Distribution/Plus DLLs are wasted compile time on a PR since
#                   the +devtools macro is purely additive on top of the base
#                   flavor — if DevTools/PlusDevTools build, the base shape
#                   almost certainly does too. Accepted risk: a #ifndef
#                   EMOT3_DEVTOOLS path could break undetected until the next
#                   main-push run catches it).
#   push: main  -> all four (Distribution + Plus + DevTools + PlusDevTools).
#                   Safety net for direct-to-main version-bump commits.
#   push: v*    -> all four + release-asset publish.
#
# Configs:
#   Distribution -> emot3.dll              (public base: no dev tools, no swallows)
#   Plus         -> emot3_plus.dll         (+plus: convenience input-swallows)
#   DevTools     -> emot3_devtools.dll     (+devtools: dev diagnostic tools)
#   PlusDevTools -> emot3_plusdevtools.dll (+plus +devtools: swallows + dev tools)
# Two additive flavor macros drive this: EMOT3_PLUS adds the AV-sensitive input-
# swallows, EMOT3_DEVTOOLS adds the diagnostic dev tools; base defines neither.
# See the README and src/emot3.vcxproj.
#
# Release assets (v* tag): emot3.dll (loose, for Nexus auto-update) +
# emot3_plus-<tag>.zip. The +devtools builds stay workflow artifacts only.
#
# Doc-only main pushes skip CI via paths-ignore (**/*.md, LICENSE) since none
# of those files affect a DLL. Tag pushes ignore path filters by GitHub Actions
# design, so releases still fire regardless of which files the bump touched.
#
# Runs entirely on GitHub-hosted windows-latest (Windows Server 2022),
# which ships with MSBuild, the C++ Build Tools, the Windows SDK,
# rc.exe, and Python 3 pre-installed - the same stack the existing
# Visual Studio .sln expects. No CMake / MinGW migration required.
#
# Public-repo runners are free with no minute cap, so the workflow
# fires on every push without budget concerns.

name: Build

on:
  push:
    branches: [main]
    # Doc-only main pushes don't affect any DLL — skip CI entirely. Tag pushes
    # ignore paths-ignore by GitHub Actions design, so releases still fire on
    # v* regardless of which files the bump commit touched.
    paths-ignore: ['**/*.md', 'LICENSE']
    tags: ['v*']
  pull_request:
    branches: [main]

# Cancel any in-flight build for the same ref when a new push lands.
# Saves runner time when commits arrive in quick succession.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The release step (softprops/action-gh-release on a v* tag) creates/updates a
# GitHub Release, which needs write access to repo contents. The default
# GITHUB_TOKEN is read-only on many repos, so grant it explicitly.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The build #includes headers from the vendored submodules
          # (imgui / nexus / mumble / nlohmann_json), so they must be fetched -
          # the default checkout does NOT init submodules.
          submodules: recursive

      # MSBuild is in the runner image but isn't on PATH by default;
      # this action wires it up for the rest of the job.
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # gen_rc.py invokes `py -3` per the project's pre-build target.
      # The Windows runner ships the `py` launcher pointed at Python 3
      # out of the box, so no setup-python action is needed.
      - name: Generate resource manifest
        run: py -3 tools/gen_rc.py

      # Build matrix: PRs only build the +devtools flavors (DevTools +
      # PlusDevTools); main/tag pushes build all four. The +devtools macro is
      # additive on top of the base flavor, so PlusDevTools building strongly
      # implies Plus does too — same DevTools -> Distribution. Each config
      # writes its own folder + DLL name (per-config TargetName / OutDir), so
      # they never clobber each other.
      - name: Build Distribution (emot3.dll, main/tag only)
        if: github.event_name != 'pull_request'
        run: msbuild emot3.sln /p:Configuration=Distribution /p:Platform=x64 /m
      - name: Build Plus (emot3_plus.dll, main/tag only)
        if: github.event_name != 'pull_request'
        run: msbuild emot3.sln /p:Configuration=Plus /p:Platform=x64 /m
      - name: Build DevTools (emot3_devtools.dll)
        run: msbuild emot3.sln /p:Configuration=DevTools /p:Platform=x64 /m
      - name: Build PlusDevTools (emot3_plusdevtools.dll)
        run: msbuild emot3.sln /p:Configuration=PlusDevTools /p:Platform=x64 /m

      # Linux/Wine readiness guard: emot3 runs on Linux under Proton/Wine, and
      # the thing that keeps it loading there is the static CRT (/MT in every
      # shipped config) - a /MD slip would silently need an MSVC redist in the
      # prefix and break on a stock Linux setup. check_imports.py parses the PE
      # import table (no dumpbin / VC env needed) and fails the job if any DLL
      # imports the dynamic CRT (vcruntime/msvcp/ucrtbase/api-ms-win-crt). The
      # +devtools DLLs are checked on every run (the only flavors PRs build);
      # the public shapes are checked on main/tag. RuntimeLibrary is per-config
      # in the vcxproj and identical across release configs, so the +devtools
      # DLLs are a faithful proxy for the public ones on a PR.
      - name: Check imports (Wine static-CRT guard, +devtools)
        run: py -3 tools/check_imports.py build/DevTools/emot3_devtools.dll build/PlusDevTools/emot3_plusdevtools.dll
      - name: Check imports (Wine static-CRT guard, public; main/tag only)
        if: github.event_name != 'pull_request'
        run: py -3 tools/check_imports.py build/Distribution/emot3.dll build/Plus/emot3_plus.dll

      # Artifact upload is split to match the asymmetric build matrix:
      # +devtools artifacts always upload (every event), public-shape artifacts
      # only on main/tag pushes. 14-day retention keeps storage well under the
      # free 500 MB quota. The +devtools DLLs stay artifacts only - never
      # published as release assets.
      - name: Upload +devtools DLL artifacts (every run)
        uses: actions/upload-artifact@v4
        with:
          name: emot3-devtools-builds
          path: |
            build/DevTools/emot3_devtools.dll
            build/PlusDevTools/emot3_plusdevtools.dll
          retention-days: 14
          if-no-files-found: error
      - name: Upload public DLL artifacts (main/tag only)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: emot3-public-builds
          path: |
            build/Distribution/emot3.dll
            build/Plus/emot3_plus.dll
          retention-days: 14
          if-no-files-found: error

      # On tag pushes (v1.0.0, v0.2.1-beta, etc.) attach the public emot3.dll AND
      # a zipped Plus build to the GitHub Release. Nexus' GitHub update provider
      # only auto-downloads a release asset whose name ends in .dll, so emot3.dll
      # stays the single, unambiguous auto-update target while emot3_plus ships as
      # a .zip the updater ignores - a public, permanent, manual download (the
      # build artifact above needs a login and expires after 14 days). Plus is a
      # distinct addon (own Signature, Provider=None) so it coexists in addons/
      # and is never auto-updated/clobbered. The +devtools builds are never shipped.
      - name: Package Plus build (zip - ignored by Nexus' .dll updater)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path build/Plus/emot3_plus.dll -DestinationPath emot3_plus-${{ github.ref_name }}.zip
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Distribution/emot3.dll
            emot3_plus-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
