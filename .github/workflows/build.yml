# emot3 CI: build on PRs + main (the gate), publish on v* tags (no rebuild).
#
# Model - build once, ship the bytes you built:
#   pull_request (into main OR release/**) -> `build` job, LIGHT: DevTools +
#       PlusDevTools only. Fast per-feature feedback. The +devtools macro is
#       additive on the base flavor, so if the +devtools shapes build the base
#       shapes almost certainly do (accepted risk: a #ifndef EMOT3_DEVTOOLS path
#       could slip past a PR until the main build catches it).
#   push: main -> `build` job, FULL: all four configs + the public static-CRT
#       import guard + uploads the emot3-public-builds artifact. THIS is the
#       release gate. It does NOT publish.
#   push: v* tag -> `publish` job ONLY (no compile): downloads the
#       emot3-public-builds artifact that the main build produced FOR THIS EXACT
#       COMMIT and attaches emot3.dll + emot3_plus-<tag>.zip to the Release. So a
#       tag ships the byte-for-byte artifacts the main build already validated,
#       and a tag can never trigger a red build.
#       >>> TAG ONLY AFTER THE MAIN BUILD IS GREEN <<< the publish job needs that
#       build's artifact; tagging before it finishes = no artifact = failed
#       publish (recoverable: re-push the tag once the main build is green).
#
# In parallel, `cross-mingw` (Linux) cross-compiles the PlusDevTools flavor (the
# maximal-code superset) with MinGW-w64 and runs the import guard in --mingw mode.
# It's a PORTABILITY GATE only - it never ships anything; it proves the code still
# compiles under libstdc++ and stays Wine-clean (no MSVC CRT, no
# libgcc/libstdc++/libwinpthread). Shipped binaries always come from the MSVC
# `build` job.
#
# Configs: Distribution -> emot3.dll | Plus -> emot3_plus.dll |
#   DevTools -> emot3_devtools.dll | PlusDevTools -> emot3_plusdevtools.dll.
#   EMOT3_PLUS adds the AV-sensitive input-swallows, EMOT3_DEVTOOLS adds the
#   diagnostic dev tools; base defines neither. See README + CMakeLists.txt.
#
# Release assets (v* tag): emot3.dll (loose, the single Nexus auto-update target)
#   + emot3_plus-<tag>.zip (a zip Nexus' .dll updater ignores -> manual Plus
#   download). The +devtools builds stay workflow artifacts only, never shipped.
#
# Doc-only main pushes skip CI via paths-ignore. Tag pushes ignore path filters
# by GitHub Actions design, so a release still fires regardless of the bump files.
#
# windows-latest builds via CMake + the bundled VS 2022 toolchain (CMake / py
# preinstalled); ubuntu-latest cross-compiles + does the no-compile publish.
# Public-repo runners are free.

name: Build

on:
  push:
    branches: [main]                 # full build = the release gate (no publish)
    # Doc-only main pushes don't affect any DLL - skip CI. Tag pushes ignore
    # paths-ignore by GitHub Actions design, so releases still fire on v*.
    paths-ignore: ['**/*.md', 'LICENSE']
    tags: ['v*']                     # publish-only job (no rebuild)
  pull_request:
    branches: [main, 'release/**']   # light build (feature PRs onto main OR a release branch)

# Cancel any in-flight run for the same ref when a new push lands.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# contents:write - the publish job creates a GitHub Release.
# actions:read    - the publish job reads/downloads the build job's artifact via
#                   the Actions API. Declaring `permissions:` replaces the token
#                   defaults, so actions:read must be listed explicitly or the
#                   artifact lookup 403s.
permissions:
  contents: write
  actions: read

jobs:
  # Compile + validate on Windows (MSVC) - the source of shipped binaries.
  # Runs on PRs (light) and main pushes (full = the gate). Never on a tag.
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The build #includes headers from the vendored submodules
          # (imgui / nexus / mumble / nlohmann_json), so they must be fetched -
          # the default checkout does NOT init submodules.
          submodules: recursive

      # CMake + the VS 2022 toolchain + the `py` launcher are preinstalled on the
      # runner image. The resource codegen (tools/gen_rc.py) runs as a build
      # dependency, so no separate generate step is needed.
      - name: Configure (CMake, VS 2022 x64)
        run: cmake -B build-vs -G "Visual Studio 17 2022" -A x64

      # Build matrix: PRs only build the +devtools flavors (DevTools +
      # PlusDevTools); main pushes build all four. The +devtools macro is
      # additive on the base flavor, so PlusDevTools building strongly implies
      # Plus does too - same DevTools -> Distribution. Each config writes its own
      # build-vs/<Config>/ folder + DLL name, so they never clobber each other.
      - name: Build Distribution (emot3.dll, main only)
        if: github.event_name != 'pull_request'
        run: cmake --build build-vs --config Distribution --parallel
      - name: Build Plus (emot3_plus.dll, main only)
        if: github.event_name != 'pull_request'
        run: cmake --build build-vs --config Plus --parallel
      - name: Build DevTools (emot3_devtools.dll)
        run: cmake --build build-vs --config DevTools --parallel
      - name: Build PlusDevTools (emot3_plusdevtools.dll)
        run: cmake --build build-vs --config PlusDevTools --parallel

      # Linux/Wine readiness guard: emot3 runs on Linux under Proton/Wine, and
      # the thing that keeps it loading there is the static CRT (/MT in every
      # shipped config) - a /MD slip would silently need an MSVC redist in the
      # prefix and break on a stock Linux setup. check_imports.py parses the PE
      # import table (no dumpbin / VC env needed) and fails the job if any DLL
      # imports the dynamic CRT (vcruntime/msvcp/ucrtbase/api-ms-win-crt). The
      # +devtools DLLs are checked on every run (the only flavors PRs build);
      # the public shapes are checked on main. The CRT setting is identical
      # across release configs, so the +devtools DLLs are a faithful proxy on a PR.
      - name: Check imports (Wine static-CRT guard, +devtools)
        run: py -3 tools/check_imports.py build-vs/DevTools/emot3_devtools.dll build-vs/PlusDevTools/emot3_plusdevtools.dll
      - name: Check imports (Wine static-CRT guard, public; main only)
        if: github.event_name != 'pull_request'
        run: py -3 tools/check_imports.py build-vs/Distribution/emot3.dll build-vs/Plus/emot3_plus.dll

      # Artifact upload mirrors the matrix: +devtools artifacts upload on every
      # build run; the public-shape artifact uploads only on main pushes and is
      # what the `publish` job ships at tag time. 14-day retention stays well
      # under the free quota; the gap between a main build and its tag is minutes.
      - name: Upload +devtools DLL artifacts (every run)
        uses: actions/upload-artifact@v4
        with:
          name: emot3-devtools-builds
          path: |
            build-vs/DevTools/emot3_devtools.dll
            build-vs/PlusDevTools/emot3_plusdevtools.dll
          retention-days: 14
          if-no-files-found: error
      - name: Upload public DLL artifacts (main only - the release gate's output)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: emot3-public-builds
          path: |
            build-vs/Distribution/emot3.dll
            build-vs/Plus/emot3_plus.dll
          retention-days: 14
          if-no-files-found: error

  # Linux portability gate: cross-compile every flavor with MinGW-w64 and verify
  # the DLL imports no dynamic runtime (MSVC CRT OR libgcc/libstdc++/libwinpthread).
  # Gate only - builds nothing that ships. Runs on the same PRs + main as `build`.
  cross-mingw:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ninja-build python3

      # Build ONLY PlusDevTools: it defines both EMOT3_PLUS and EMOT3_DEVTOOLS, so
      # it compiles every plus/ + devtools/ TU plus the whole base - the maximal
      # source set, and thus the strongest single proxy for "does it still
      # cross-compile + stay Wine-clean." Building all four would ~4x the wall time
      # for little extra coverage (the Windows `build` job builds all four on main,
      # which catches any base-only #ifndef-stub portability slip). The toolchain
      # file picks the POSIX threading variant (libstdc++ needs it for
      # std::thread/mutex) and links the GCC/C++ runtimes statically so the import
      # table stays Wine-clean.
      - name: Cross-compile (PlusDevTools, the maximal-code flavor)
        run: |
          set -euo pipefail
          cmake -B build-mingw -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw-w64.cmake \
            -DCMAKE_BUILD_TYPE=PlusDevTools
          cmake --build build-mingw

      - name: Import gate (--mingw: static CRT + no MinGW runtimes)
        run: python3 tools/check_imports.py --mingw build-mingw/emot3_plusdevtools.dll

  # Publish-only. Runs on a v* tag, never compiles: it ships the exact
  # emot3-public-builds artifact the main `build` produced for this commit. A red
  # build therefore can never reach a release, and the published bytes are
  # identical to the validated ones.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download the validated public build for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The emote-public-builds artifact was produced by the main `build` run
          # for THIS exact commit (the tag points at it). Find it by head_sha so
          # we never grab a different commit's bytes, and so the tag's own run
          # (which has no such artifact) is ignored.
          ART_ID=$(gh api "repos/$REPO/actions/artifacts?name=emot3-public-builds&per_page=100" \
            --jq "[.artifacts[] | select(.workflow_run.head_sha==\"$SHA\" and .expired==false)] | sort_by(.created_at) | last | .id")
          if [ -z "$ART_ID" ] || [ "$ART_ID" = "null" ]; then
            echo "::error::No emot3-public-builds artifact for $SHA. The main build must be green and finished before you tag. Re-push the tag once it is."
            exit 1
          fi
          gh api "repos/$REPO/actions/artifacts/$ART_ID/zip" > public.zip
          mkdir -p _assets && unzip -o public.zip -d _assets

      - name: Stage release assets (no compile)
        run: |
          set -euo pipefail
          DLL=$(find _assets -name emot3.dll | head -1)
          PLUS=$(find _assets -name emot3_plus.dll | head -1)
          if [ -z "$DLL" ] || [ -z "$PLUS" ]; then
            echo "::error::Downloaded artifact is missing emot3.dll or emot3_plus.dll."
            exit 1
          fi
          cp "$DLL" emot3.dll
          # Zip Nexus' .dll updater ignores -> manual Plus download, name carries the tag.
          zip -j "emot3_plus-${{ github.ref_name }}.zip" "$PLUS"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            emot3.dll
            emot3_plus-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
